<!DOCTYPE html>
<html lang="pt-br">

<head>
    <!-- Meta tags Obrigatórias -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="./style/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="./style/cookie-consent.css">
    <link rel="icon" href="./img/icone.png" type="image/x-icon">
    <title>Fale Conosco</title>
</head>

<body>

    <div id="menu-container"></div>
    <div id="successModal" class="modal">
        <div class="modal-content">
            <p>Email enviado com sucesso!</p>
            <span class="close" onclick="closeModal()">&times;</span>
        </div>
    </div>

    <img class="img-fluid d-block w-100 d-none d-sm-block" src="./img/fale_conosco/capa-fale-conosco.png">
    <img class="img-fluid d-block w-100 d-sm-none" src="./img/fale_conosco/capa-fale-conosco respo.png">
    

    <div class="grid_exames container text-center col-8">
        <div class="row row-cols-1 row-cols-md-2">
            <div class="col">
                <div class="titulo_exames">
                    <strong>fale conosco</strong>
                </div><br>
                <div class="texto1">
                    Está com alguma dúvida?
                    <br />
                    Estamos sempre interessados no que você tem a dizer, use este canal para falar diretamente com a
                    nossa equipe.
                </div>
                <br />
            <div class="bloco">
                <div>
                    <div class="titulo_examess">
                        <h4>RECEPÇÃO:</h4>
                    </div>
                    <div class="texto11">
                        <i class="bi bi-telephone"></i> 35 3531-5710
                    </div>
                </div>
                <div>
                    <div class="titulo_examess">
                        <h4>OUVIDORIA:</h4>
                    </div>
                    <div class="texto11">
                        <i class="bi bi-whatsapp"></i> 35 99921-2077
                    </div>
                </div>
            </div>
            
            </div>
            <div class="col">
                <div class="map-responsive">

                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2945.457140950263!2d-46.987016725821924!3d-20.92410887003145!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94b7177c9051bf35%3A0x5f1d8f537e14a604!2sMed%20%26%20Imagem!5e1!3m2!1spt-BR!2sbr!4v1734298462441!5m2!1spt-BR!2sbr"
                        width="00" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade"></iframe>

                </div>
            </div>

        </div>
    </div>

    <div class="formulario">
        <div class="d-flex justify-content-center align-items-center vh-100">


            <form id="contactForm" class="w-75 w-md-50">

                <div class="mb-3">
                    <input type="text" class="form-control" id="nome" name="nome" required placeholder="nome">
                </div>
                <div class="mb-3">
                    <input type="email" class="form-control" id="email" placeholder="e-mail" name="email" required>
                </div>
                <div class="mb-3">
                    <input type="text" class="form-control" id="celular" placeholder="telefone" name="celular" required>
                </div>
                <div class="mb-3">
                    <textarea class="form-control" id="mensagem" rows="3" placeholder="Digite a sua mensagem"
                        name="mensagem" required></textarea>
                </div>
                <div class="d-flex justify-content-center">
                    <button class="enviar_email" type="button" onclick="sendEmail()">Enviar</button>
                </div>
            </form>
        </div>
    </div>





    <div id="carrossel"></div>


    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="./JS/script.js"></script>
    <script src="./JS/cookie-consent.js" defer></script>

</body>

</html>
